name: Operations read-only probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Mint Academic Door read-only GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.OPS_APP_CLIENT_ID }}
          private-key: ${{ secrets.OPS_APP_PRIVATE_KEY }}
          owner: academic-door

      - name: Collect GitHub operations evidence
        run: python scripts/collect_github.py --org academic-door --output data/github-latest.json
        env:
          GITHUB_READ_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Build normalized Operations snapshot
        run: python scripts/build_snapshot.py --seed data/seed-snapshot.json --github data/github-latest.json --output data/latest.json

      - name: Validate normalized snapshot
        run: python scripts/validate_snapshot.py data/latest.json

      - name: Render private report
        run: python scripts/render_report.py data/latest.json reports/latest.md

      - name: Upload bounded probe artifacts
        uses: actions/upload-artifact@v4
        with:
          name: operations-read-only-probe
          if-no-files-found: error
          retention-days: 7
          path: |
            data/github-latest.json
            data/latest.json
            reports/latest.md
