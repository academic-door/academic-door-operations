name: Operations daily public-safe report

on:
  workflow_dispatch:
  schedule:
    - cron: "57 10 * * *"

permissions:
  contents: read

concurrency:
  group: academic-door-operations-daily-report
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Mint Academic Door read-only GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.OPS_APP_CLIENT_ID }}
          private-key: ${{ secrets.OPS_APP_PRIVATE_KEY }}
          owner: academic-door

      - name: Prepare transient and public-safe workspaces
        run: |
          mkdir -p "$RUNNER_TEMP/academic-door-operations"
          mkdir -p public

      - name: Collect transient GitHub operations evidence
        run: python -m scripts.collect_github --org academic-door --output "$RUNNER_TEMP/academic-door-operations/github.json"
        env:
          GITHUB_READ_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Collect transient bounded public owner telemetry
        run: python -m scripts.collect_owner_telemetry --output "$RUNNER_TEMP/academic-door-operations/owner.json"

      - name: Build public-safe Operations snapshot
        run: python scripts/build_snapshot.py --seed data/seed-snapshot.json --github "$RUNNER_TEMP/academic-door-operations/github.json" --owner "$RUNNER_TEMP/academic-door-operations/owner.json" --output public/latest.json

      - name: Validate public-safe snapshot
        run: python scripts/validate_snapshot.py public/latest.json

      - name: Render public-safe report
        run: python scripts/render_report.py public/latest.json public/latest.md

      - name: Build public artifact manifest
        run: python scripts/build_public_manifest.py --directory public --output public/manifest.json

      - name: Upload public-safe report artifacts
        uses: actions/upload-artifact@v4
        with:
          name: operations-public-safe-report
          if-no-files-found: error
          retention-days: 7
          path: |
            public/latest.json
            public/latest.md
            public/manifest.json
