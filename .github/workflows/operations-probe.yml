name: Operations daily read-only report

on:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * *"

permissions:
  contents: read

concurrency:
  group: academic-door-operations-daily-report
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Mint Academic Door read-only GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.OPS_APP_CLIENT_ID }}
          private-key: ${{ secrets.OPS_APP_PRIVATE_KEY }}
          owner: academic-door

      - name: Collect GitHub operations evidence
        run: python -m scripts.collect_github --org academic-door --output data/github-latest.json
        env:
          GITHUB_READ_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Collect bounded public owner telemetry
        run: python -m scripts.collect_owner_telemetry --output data/owner-latest.json

      - name: Build normalized Operations snapshot
        run: python scripts/build_snapshot.py --seed data/seed-snapshot.json --github data/github-latest.json --owner data/owner-latest.json --output data/latest.json

      - name: Validate normalized snapshot
        run: python scripts/validate_snapshot.py data/latest.json

      - name: Render private report
        run: python scripts/render_report.py data/latest.json reports/latest.md

      - name: Upload bounded report artifacts
        uses: actions/upload-artifact@v4
        with:
          name: operations-read-only-report
          if-no-files-found: error
          retention-days: 30
          path: |
            data/github-latest.json
            data/owner-latest.json
            data/latest.json
            reports/latest.md
